# Local overlay for iterating on Workspace UI from source.
# - Workspace built from local source (via docker-compose.dev.yml).
# - Runs on host port 3001 (3000 is taken by remnawave on this host).
# - Does NOT start the hermes-agent container: the host already runs a
#   gateway on 127.0.0.1:8642. Workspace reaches it via host.docker.internal.
# - Mounts the host's real ~/.hermes (read-only) so /memory shows actual files.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.local.yml up -d --build

services:
  # Disable the agent container (host gateway on 8642 is already running).
  hermes-agent:
    profiles: ['disabled']

  hermes-workspace:
    depends_on: {}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      HERMES_API_URL: http://host.docker.internal:8642
      HERMES_DASHBOARD_URL: http://host.docker.internal:9119
      HERMES_API_TOKEN: ''
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - /root/.hermes:/home/workspace/.hermes:ro
